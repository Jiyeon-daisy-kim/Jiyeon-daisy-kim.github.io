<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artwork | Daisyeon</title>
  <link rel="stylesheet" href="../assets/css/espacio_novo_font.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="css/art_work_style.css?v=20261008i">
  <link rel="icon" href="../assets/images/favicon.png" type="image/png">
  <script src="../assets/js/nav-bar-for-file-structure.js?v=20261008b" defer></script>
  <script src="../assets/js/footer-bar-for-file-structure.js" defer></script>
  <script src="js/art-gallery.js?v=20261008i" defer></script>
</head>
<body>
  <div class="frame">
    <nav-bar layout="page"></nav-bar>
    <main>
      <h1 class="page-title">Artwork</h1>
      <div class="artwork-layout">
        <nav id="artwork-list" class="artwork-list" aria-label="Select an artwork"></nav>
        <section id="artwork-viewer" class="artwork-viewer" aria-label="Selected artwork" aria-busy="true">
          <p id="gallery-status" role="status">Loading artwork…</p>
        </section>
      </div>
      <noscript><p>Enable JavaScript to explore the artwork and its details.</p></noscript>
    </main>
    <footer-bar></footer-bar>
  </div>
  <dialog id="detail-dialog" aria-labelledby="detail-title">
    <div class="dialog-toolbar">
      <h2 id="detail-title"></h2>
      <button id="close-detail" type="button" aria-label="Close detail">×</button>
    </div>
    <p id="detail-status" role="status"></p>
    <img id="detail-image" alt="">
    <div class="detail-navigation">
      <button id="previous-detail" type="button">← Previous</button>
      <span id="detail-count" aria-live="polite"></span>
      <button id="next-detail" type="button">Next →</button>
    </div>
  </dialog>
</body>
</html>
